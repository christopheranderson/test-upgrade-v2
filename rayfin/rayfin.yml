id: test-upgrade
name: test-upgrade
version: 1.0.0
services:
  connectors:
    enabled: true
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - https://grand-olive-83551d84fc-westcentralus.webapp.msit.fabricapps.net
  data:
    enabled: true
    path: packages/data
    buildCommand: npm run build
    dialect: mssql
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: true
    path: packages/functions
    buildCommand: npm run build
    auth:
      type: application
connectors:
  - name: coffeesales
    config:
      workspaceId: ea3779f7-4d16-4fbc-87ba-f501e2a6fdee
      itemId: 92a63060-dcef-4d6b-ac2f-cdd1bae79b43
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
    type: fabric-semanticmodel
